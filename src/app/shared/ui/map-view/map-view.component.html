<div
  class="map-wrapper"
  [style.height]="height"
  role="region"
  aria-label="Mapa interactivo de cobranza"
>
  <div #containerRef class="leaflet-map-canvas"></div>

  <div class="map-controls">
    <button
      type="button"
      class="btn-ctrl btn-layer-mode"
      [class.active]="isSatelliteMode()"
      (click)="toggleSatelliteMode()"
      [attr.aria-label]="layerModeLabel()"
      [title]="layerModeLabel()"
    >
      {{ layerModeIcon() }}
    </button>
    <button type="button" class="btn-ctrl" (click)="zoomIn()" aria-label="Acercar mapa" title="Acercar">+</button>
    <button type="button" class="btn-ctrl" (click)="zoomOut()" aria-label="Alejar mapa" title="Alejar">-</button>
    <button type="button" class="btn-ctrl" (click)="fitToBounds()" aria-label="Centrar todos los puntos" title="Centrar">⛶</button>
  </div>

  <div class="map-watermark">
    <span>&copy; <a href="https://www.esri.com/" target="_blank" rel="noopener">Esri</a></span>
  </div>
</div>
